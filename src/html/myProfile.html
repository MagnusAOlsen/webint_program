<!DOCTYPE html>
<html lang="en">

<head>
    <title>
        WineLover - My Profile
    </title>
    <link rel="icon" type="image/png" href="../../images/favicon.png" />
    <link rel="stylesheet" href="../styles/homepage.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/myProfile.css">
    <!-- Leaflet added for map functionality -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <div class="header">
        <div class="appName">
            <h1>WineLover</h1>
        </div>
        <div class="menu">
            <button class="menuButton" onclick="window.location.href='homepage.html'">Homepage</button>
            <button class="menuButton" onclick="window.location.href='search.html'">Search</button>
            <button class="menuButton" onclick="window.location.href='myReviews.html'">My reviews</button>
            <button class="menuButton" onclick="window.location.href='myProfile.html'">My profile</button>
            <button class="menuButton" onclick="window.location.href='help.html'">Help</button>
        </div>
    </div>

    <main class="myProfile">
        <h1 class="heading">My Profile</h1>
        <section class="profileHeader">
            <div class="profilePicture">
                <img src="../../images/profile.png" alt="Profile Picture">
            </div>
            
            <div class="bioInfo">
                <p><strong>Name</strong> Francis Scott</p>
                <p><strong>Email Address</strong> email@email.com</p>
                <p><strong>Age</strong> 27</p>
                <p><strong>Nationality</strong> French</p>
            </div>

            <div class="quoteBox">
                <h3>Quote</h3>
                <div class="quote-content">
                    <p>I love to drink wine because...</p>
                </div>
            </div>
        </section>

        <section class="mapSection">
            <h2>My Wine Map</h2>
            <div id="map" style="height: 400px; width: 100%; border-radius: 15px; border: 2px solid #800000;"></div>
        </section>

        <section class="reviewsSection">
            <div class="reviewsHeader">
                <h2 class="sectionHeading">My Most Recent Reviews</h2>
                <a href="myReviews.html" class="viewAllLink">View all my reviews &rarr;</a>
            </div>
            <div id="profileReviewsGrid" class="reviewsGrid"></div>
        </section>
    </main>
    <script src="../javascript/myProfile.js"></script>
</body>

<footer class="footer">
    <p>© 2026 WineLover</p>
</footer>
