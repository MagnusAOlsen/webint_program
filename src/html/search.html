<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        WineLover - Search
    </title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/styles/homepage.css">
    <link rel="stylesheet" href="/styles/search.css">
    <link rel="stylesheet" href="/styles/global.css">

    <meta charset="UTF-8">

</head>



<body>
    <header class="header">
        <div class="appName">
            <h1 class="siteTitle" onclick="window.location.href='/'">WineLover</h1>
        </div>
        <div class="menu">
            <button class="menuButton" onclick="window.location.href='/'">Homepage</button>
            <button class="menuButton" onclick="window.location.href='/search'">Search</button>
            <button class="menuButton" onclick="window.location.href='/myReviews'">My reviews</button>
            <button class="menuButton" onclick="window.location.href='/myProfile'">My profile</button>
            <button class="menuButton" onclick="window.location.href='/help'">Help</button>
        </div>
    </header>
    <div class="searchLayout"> 
        <main class="searchPage">
            <form class="findWines">
                <h2 class="heading">Find a wine</h2>
                <p class="searchHint">Fill in as many as desired</p>

                <div class="findWinesInformation">
                    <div class="findWinesRow">
                        <label for="wine-name">Name</label>
                        <input id="wine-name" type="text" name="Name">
                    </div>
                    <div class="findWinesRow">
                        <label for="wine-year">Year</label>
                        <input id="wine-year" type="number" name="Year">
                    </div>
                    <div class="findWinesRow">
                        <label for="wine-grape">Grape</label>
                        <input id="wine-grape" type="text" name="Grape">
                    </div>
                    <div class="findWinesRow">
                            <label for="wine-type">Type</label>
                            <select class="wineTypeSelection" id="wine-type" name="Type">
                                <option value=""> Select a wine-type</option>
                                <option value="red">Red</option>
                                <option value="white">White</option>
                                <option value="rose">Rosé</option>
                            </select>
                    </div>
                    <div class="findWinesRow">
                        <label for="wine-location">Location</label>
                        <input id="wine-location" type="text" name="Location">
                    </div>
                    <div class="findWinesRow">
                            <label for="wine-price">Price</label>
                            <input id="wine-price" type="text" name="Price">
                    </div>
                    <div class="findWinesRow">
                        <label for="wine-keywords">Keywords</label>
                        <input id="wine-keywords" type="text" name="Keywords">
                    </div>
                </div>
                <button class="primaryButton" type="submit">
                    Search
                </button>
                <button class="primaryButton" type="button" id="showAllButton">
                    Clear filters
                </button>
            </form>
        </main>
        <div class="resultsSection">
            <div class="resultsSectionHeader">
                <h2>Results</h2>
                <div class="viewToggleWrapper">
                    <button class="viewToggleBtn" id="viewToggleBtn" title="Toggle between pages and show all">Show All</button>
                </div>
                <div class="sortWrapper">
                    <button class="sortButton" id="sortButton" title="Sort results">&#8645;</button>
                    <div class="sortDropdown" id="sortDropdown">
                        <button class="sortOption" data-sort="name-asc">Name A &#8594; Z</button>
                        <button class="sortOption" data-sort="name-desc">Name Z &#8594; A</button>
                        <button class="sortOption" data-sort="price-asc">Price Low &#8594; High</button>
                        <button class="sortOption" data-sort="price-desc">Price High &#8594; Low</button>
                    </div>
                </div>
            </div>
            <div class="wineResults">
            </div>
            <div class="paginationControls" id="paginationControls">
                <button class="paginationBtn" id="prevPage">&#8592; Prev</button>
                <span class="pageIndicator" id="pageIndicator">Page 1 of 1</span>
                <button class="paginationBtn" id="nextPage">Next &#8594;</button>
            </div>
        </div>
    </div>
    <script src="/javascript/utils.js"></script>
    <script src="/javascript/search.js"></script>
    
    <footer class="footer">
        <p>© 2026 WineLover</p>
    </footer>
</body>
