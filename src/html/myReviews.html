<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>
            WineLover - My Reviews
        </title>
        <link rel="icon" type="image/png" href="../../images/favicon.png" />
        <link rel="stylesheet" href="../styles/global.css">
        <link rel="stylesheet" href="../styles/myReviews.css">
    </head>

    <body>
        <div class="page">
            <div class="header">
                <div class="appName">
                    <h1>WineLover</h1>
                </div>
                <div class="menu">
                    <button class="menuButton" onclick="window.location.href='homepage.html'">Homepage</button>
                    <button class="menuButton" onclick="window.location.href='search.html'">Search</button>
                    <button class="menuButton" onclick="window.location.href='myReviews.html'">My reviews</button>
                    <button class="menuButton" onclick="window.location.href='myProfile.html'">My profile</button>
                </div>
            </div>
            <div id="backdrop" class="hidden"></div>
            <form id="searchWine" class="hidden">
                <input type="text" id="nameOfWine" placeholder="Name of the wine">
                <input type="text" id="location" placeholder="Location (country, city)">
                <input type="text" id="year" placeholder="year (ex: 2021)">
                <div id="stars" class="stars">
                    <span class="star" data-val="1">★</span>
                    <span class="star" data-val="2">★</span>
                    <span class="star" data-val="3">★</span>
                    <span class="star" data-val="4">★</span>
                    <span class="star" data-val="5">★</span>
                </div>
                <input type="text" id="keywords" placeholder="Keywords (separate with comma)">
                <input type="text" id="food" placeholder="Food to match the wine"> 
            </form>
            <div class="fullReview">
                <div class="reviewHeader">
                    <div class="reviewHeaderLeft">
                        <h1 class="myRewievsTitle">My reviews</h1>
                        <button id="filterButton" class="filterButton">
                            <img class="filterImage" src="../../images/search_filter.png">
                        </button>
                    </div>
                    <button id="addWineButton" class="addWineButton"><h2 class="addWineButtonText">Add new wine</h2></button>
                </div>
                <div class="wineBoxes" id="wineBoxes">
                </div>
            </div>
        </div>
        <script src="../javascript/utils.js"></script>
        <script src="../javascript/myReviews.js"></script>
    </body>
</html>

<footer class="footer">
    <p>© 2026 WineLover</p>
</footer>
