<!DOCTYPE html>
<html lang="en">
    <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>
            WineLover - My Reviews
        </title>
        <link rel="icon" type="image/png" href="/images/favicon.png">
        <link rel="stylesheet" href="/styles/global.css">
        <link rel="stylesheet" href="/styles/myReviews.css">
    </head>

    <body>
        <div class="page">
            <div class="header">
                <div class="appName">
                    <h1 class="siteTitle" onclick="window.location.href='/'">WineLover</h1>
                </div>
                <div class="menu">
                    <button class="menuButton" onclick="window.location.href='/'">Homepage</button>
                    <button class="menuButton" onclick="window.location.href='/search'">Search</button>
                    <button class="menuButton" onclick="window.location.href='/myReviews'">My reviews</button>
                    <button class="menuButton" onclick="window.location.href='/myProfile'">My profile</button>
                    <button class="menuButton" onclick="window.location.href='/help'">Help</button>
                </div>
            </div>
            <div id="backdrop" class="hidden"></div>
            <div id="fullWine" class="fullWine hidden"></div>
            <form id="searchWine" class="hidden">
                <input type="text" id="nameOfWine" placeholder="Name of the wine" required>
                <input type="text" id="grape" placeholder="Grape (e.g., cabernet sauvignon)">
                <select id="color">
                    <option value="">Color</option>
                    <option value="red">Red</option>
                    <option value="white">White</option>
                    <option value="rose">Rosé</option>
                </select>
                <input type="text" id="price" placeholder="Price (e.g., 150€)">
                <input type="text" id="location" placeholder="Location (country, city)">
                <input type="number" id="year" placeholder="year (ex: 2021)">
                <div id="stars" class="stars" data-rating="0">
                    <span class="star" data-val="1">★</span>
                    <span class="star" data-val="2">★</span>
                    <span class="star" data-val="3">★</span>
                    <span class="star" data-val="4">★</span>
                    <span class="star" data-val="5">★</span>
                </div>
                <input type="text" id="keywords" placeholder="Keywords (separate with comma)">
                <input type="text" id="food" placeholder="Food to match the wine">
                <textarea id="description" placeholder="Your review" rows="3"></textarea>
                <label id="imageLabel" class="fileField">
                    <img class="uploadIcon" src="/images/upload_file_image.webp" alt="">
                    <img class="uploadPreview" id="uploadPreview" alt="">
                    <span class="uploadHint" id="uploadHint">Drop a picture here or click to choose from files</span>
                    <span class="uploadFileName" id="uploadFileName"></span>
                    <input type="file" id="addImage" accept="image/*">
                </label>
                <button type="submit" class="addWineButton">Save review</button>
                <button type="button" id="clearFilterButton" class="addWineButton hidden">Clear filter</button>
            </form>
            <div class="fullReview">
                <div class="reviewHeader">
                    <div class="reviewHeaderLeft">
                        <h1 class="myRewievsTitle">My reviews</h1>
                        <button id="filterButton" class="filterButton">
                            <img class="filterImage" src="/images/search_filter_white.png">
                        </button>
                    </div>
                    <button id="addWineButton" class="addWineButton"><h2 class="addWineButtonText">Add new wine</h2></button>
                </div>
                <div class="wineBoxes" id="wineBoxes">
                </div>
            </div>
        </div>
        <script src="/javascript/utils.js"></script>
        <script src="/javascript/myReviews.js"></script>

        <footer class="footer">
            <p>© 2026 WineLover</p>
        </footer>
    </body>
</html>
