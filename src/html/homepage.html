<!DOCTYPE html>
<html lang="en">


<head>
    <title>
        WineLover - homepage
    </title>
    <link rel="icon" type="image/png" href="../../images/favicon.png" />
    <link rel="stylesheet" href="../styles/homepage.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/search.css">
</head>

<body>
    <div class="header">
        <div class="appName">
            <h1>WineLover</h1>
        </div>
        <div class="menu">
            <button class="menuButton" onclick="window.location.href='homepage.html'">Homepage</button>
            <button class="menuButton" onclick="window.location.href='search.html'">Search</button>
            <button class="menuButton" onclick="window.location.href='myReviews.html'">My reviews</button>
            <button class="menuButton" onclick="window.location.href='myProfile.html'">My profile</button>
            <button class="menuButton" onclick="window.location.href='help.html'">Help</button>
        </div>
    </div>
    <div class="mainPage">
        <div class="wineOfTheDay">
            <h1 class="heading">Wine of the day</h1>
            <!--We should retrieve this image from the wineReviews.json file, and have it changed everyday-->
            <img class="wineImage" src="../../images/testImage.png" height="250" width="200">
            <form class="findWines" action="search.html" method="GET">
                <h2 class="heading">Find a wine</h2>
                <p>Fill in as many as desired</p>
                <div class="findWinesInformation">
                    <div class="findWinesRow">
                        <label for="wine-name">Name</label>
                        <input id="wine-name" type="text" name="Name">
                    </div>
                    <div class="findWinesRow">
                        <label for="wine-year">Year</label>
                        <input id="wine-year" type="number" name="Year">
                    </div>
                    <div class="findWinesRow">
                        <label for="wine-grape">Grape</label>
                        <input id="wine-grape" type="text" name="Grape">
                    </div>
                    <div class="findWinesRow">
                        <label for="wine-type">Type</label>
                        <select class="wineTypeSelection" id="wine-type" name="Type">
                            <option value=""> Select a wine-type</option>
                            <option value="red">Red</option>
                            <option value="white">White</option>
                            <option value="rose">Rosé</option>
                        </select>
                    </div>
                    <div class="findWinesRow">
                        <label for="wine-location">Location</label>
                        <input id="wine-location" type="text" name="Location">
                    </div>
                    <div class="findWinesRow">
                        <label for="wine-price">Price</label>
                        <input id="wine-price" type="text" name="Price">
                    </div>
                    <div class="findWinesRow">
                        <label for="wine-keywords">Keywords</label>
                        <input id="wine-keywords" type="text" name="Keywords">
                    </div>
                </div>
                <button class="primaryButton" type="submit">
                    Search
                </button>
            </form>
        </div>
        <div class="myWines">
            <button class="myWinesButton primaryButton" onclick="window.location.href='myReviews.html'">
                <h1>My wines</h1>
            </button>
            <div class="wineReviewImages" id="wineReviewImages">
            </div>
        </div>
    </div>
    <script src="../javascript/utils.js"></script>
    <script src="../javascript/homepage.js"></script>
</body>

<footer class="footer">
    <p>© 2026 WineLover</p>
</footer>
